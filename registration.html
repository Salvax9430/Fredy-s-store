<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="css/systems.css">
</head>

<body>
    <div class="container">
        <div class="logo">Freddy's Store</div>
        <h1 class="input-group">Create an Account</h1>
        <p class="subtitle" style="background-color: aliceblue;">Fill in the form below to register with Freddy's Store.
        </p>

        <form>
            <div class="input-group">
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="input-group">
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms.</label>
            </div>

            <button type="submit">Register</button>
            <p><a href="landing.html">Back to home</a></p>
    </div>


</body>

</html>
